<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Sun!</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#fff1cf;--card:rgba(255,255,255,.1);--day1:#2a1260;--day2:#07041a;--night1:#0b0a24;--night2:#020208;
color-scheme:dark;box-sizing:border-box;height:100%;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0}
body{height:100%;display:flex;flex-direction:column;background:radial-gradient(ellipse at 50% 42%,var(--day1),var(--day2) 78%);color:var(--ink);font-family:Fredoka,system-ui,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none;position:relative}
body::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 42%,var(--night1),var(--night2) 78%);opacity:0;transition:opacity 1.2s;pointer-events:none;z-index:0}
body.night::after{opacity:1}
#stars{position:absolute;inset:0;z-index:0;pointer-events:none}
#stars i{position:absolute;border-radius:50%;background:#fff;opacity:.8;animation:tw 3.2s infinite}
@keyframes tw{50%{opacity:.15}}
h1{position:relative;z-index:2;margin:14px 0 0;text-align:center;font-size:34px;font-weight:700;letter-spacing:.5px;color:#ffe27a;text-shadow:0 0 18px rgba(255,160,40,.7)}
#stage{position:relative;z-index:1;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;flex-direction:column}
#jump{will-change:transform}
#sunwrap{width:min(78vw,46vh,400px);animation:bob 3.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-9px)}}
#sun{display:block;width:100%;overflow:visible;transition:filter 1s}
body.night #sun{filter:brightness(.62) saturate(.85)}
#glow{animation:pulse 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{50%{opacity:.7;transform:scale(1.05)}}
.eye{transform-box:fill-box;transform-origin:center}
.arc,.closed{display:none}
#face[data-eyes=arc] .eye,#face[data-eyes=closed] .eye{display:none}
#face[data-eyes=arc] .arc{display:block}
#face[data-eyes=closed] .closed{display:block}
#cap{position:absolute;bottom:6px;left:0;right:0;text-align:center;font-size:17px;color:#ffd9a0;opacity:.9;min-height:24px}
#hint{position:absolute;top:2px;left:0;right:0;text-align:center;font-size:14px;color:#c9b8ff;transition:opacity 1s}
#fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:5}
.fx{position:absolute;line-height:1}
#ui{position:relative;z-index:2;padding:8px 16px 16px;display:flex;flex-direction:column;gap:12px;align-items:center}
.stats,.btns{display:flex;gap:10px;width:min(92vw,460px)}
.stat{flex:1;background:var(--card);border-radius:14px;padding:7px 10px;font-size:14px}
.bar{height:8px;border-radius:5px;background:rgba(255,255,255,.16);margin-top:5px;overflow:hidden}
.bar i{display:block;height:100%;width:50%;border-radius:5px;transition:width .5s}
button{flex:1;font:inherit;font-weight:700;font-size:17px;padding:12px 4px;border:0;border-radius:18px;background:linear-gradient(#ffd75c,#ff9d2b);color:#5a2400;box-shadow:0 5px 0 #b05609;cursor:pointer;transition:transform .08s,box-shadow .08s;touch-action:manipulation}
button:active{transform:translateY(4px);box-shadow:0 1px 0 #b05609}
button:focus-visible{outline:3px solid #fff;outline-offset:2px}
#stars{transition:opacity .8s}
#sun{filter:hue-rotate(var(--hue,0deg))}
body.night #sun{filter:hue-rotate(var(--hue,0deg)) brightness(.62) saturate(.85)}
#face{transition:transform .2s}
#nav{position:relative;z-index:3;display:flex;gap:6px;justify-content:center;margin:8px 10px 0;flex-wrap:wrap}
#nav button,#gear{flex:none;font-size:14px;padding:7px 12px;border-radius:999px;background:var(--card);color:var(--ink);box-shadow:none;border:1px solid rgba(255,255,255,.25);backdrop-filter:blur(6px)}
#nav button.on{background:linear-gradient(#ffd75c,#ff9d2b);color:#5a2400;font-weight:700}
#gear{position:absolute;top:10px;right:12px;z-index:4;font-size:20px;padding:6px 10px}
#decor{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#decor::after{content:"";position:absolute;left:0;right:0;bottom:0;height:24%;display:none}
.d{position:absolute;filter:drop-shadow(0 4px 6px rgba(0,0,0,.25))}
.d.fl{animation:flt 5s ease-in-out infinite}
@keyframes flt{50%{transform:translate(20px,-14px)}}
body[data-room=kitchen]{--day1:#ffe6b8;--day2:#e9975a;--ink:#4a2200;--card:rgba(255,255,255,.5)}
body[data-room=bedroom]{--day1:#5a3a8a;--day2:#241240}
body[data-room=garden]{--day1:#bfe8ff;--day2:#6cc0ee;--ink:#123;--card:rgba(255,255,255,.5)}
body[data-room=kitchen] #decor::after{display:block;background:repeating-conic-gradient(#fff6e8 0 25%,#e7b98b 0 50%) 0 0/48px 48px}
body[data-room=bedroom] #decor::after{display:block;background:linear-gradient(#7a4a2a,#3d2210)}
body[data-room=garden] #decor::after{display:block;background:linear-gradient(#7fd35a,#3f9a35)}
body[data-room=kitchen] h1{color:#c2410c;text-shadow:0 2px 0 #fff}
body[data-room=garden] h1{color:#fff;text-shadow:0 2px 8px rgba(0,60,100,.5)}
body[data-room=kitchen] #cap,body[data-room=kitchen] #hint{color:#6a3300}
body[data-room=garden] #cap{color:#143d24}
body[data-room=garden] #hint{color:#1c4a78}
#fridge{position:absolute;left:3%;bottom:4%;width:min(27vw,128px);height:min(46vh,250px);display:none;z-index:2}
body[data-room=kitchen] #fridge{display:block}
body[data-room=kitchen] #sunwrap{width:min(58vw,42vh,380px);margin-left:min(20vw,140px)}
.fdoor{position:absolute;inset:0;z-index:2;background:linear-gradient(90deg,#f2f9fd,#cfe5f1);border:3px solid #8fb2c6;border-radius:12px;transform-origin:left center;transition:transform .55s cubic-bezier(.3,1.3,.5,1);cursor:pointer;box-shadow:0 6px 14px rgba(0,0,0,.25)}
.fdoor::before{content:"";position:absolute;right:10px;top:34%;width:8px;height:32%;border-radius:4px;background:#8aa5b5}
.fdoor::after{content:"❄️";position:absolute;left:10px;top:8px;font-size:18px}
#fridge.open .fdoor{transform:perspective(600px) rotateY(-112deg)}
.fin{position:absolute;inset:0;background:repeating-linear-gradient(#f7fdff 0 calc(33.3% - 3px),#a9c7d6 0 33.3%);border:3px solid #8fb2c6;border-radius:12px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(3,1fr);align-items:center;justify-items:center;padding:4px}
.food{font-size:clamp(24px,4.4vh,34px);cursor:grab;touch-action:none;transition:transform .15s;pointer-events:none}
#fridge.open .food{pointer-events:auto}
.food:hover{transform:scale(1.2)}
#panel{position:fixed;z-index:8;top:calc(env(safe-area-inset-top,0px) + 52px);right:12px;width:min(86vw,300px);background:rgba(25,15,50,.93);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.2);border-radius:18px;padding:14px;display:none;color:#fff1cf;font-size:15px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
#panel.show{display:block}
#panel label{display:flex;justify-content:space-between;align-items:center;margin:8px 0}
#panel input[type=range]{width:120px;accent-color:#ffb030}
#panel input[type=checkbox]{width:20px;height:20px;accent-color:#ffb030}
.sw{display:flex;gap:8px;margin:8px 0}
.sw b{width:30px;height:30px;border-radius:50%;border:3px solid transparent;cursor:pointer}
.sw b.on{border-color:#fff}
#panel button{width:100%;margin-top:8px;font-size:14px;padding:8px}
.btns button{font-size:15px}
body.gaming h1,body.gaming #nav,body.gaming #hint,body.gaming #fridge{visibility:hidden}
body.gaming #gear,body.gaming #ui{opacity:.35;pointer-events:none}
body.gaming #sunwrap{width:min(34vw,170px);margin-left:0}
body.gaming #stage{justify-content:flex-end}
body.gaming #jump{margin-bottom:40px}
#hud{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:50%;transform:translateX(-50%);z-index:6;display:none;gap:10px;align-items:center;background:rgba(20,10,40,.75);color:#fff1cf;padding:8px 14px;border-radius:999px;font-weight:700}
body.gaming #hud{display:flex}
#hud button{flex:none;padding:2px 10px;font-size:14px;border-radius:12px;box-shadow:none}
.ob{position:fixed;z-index:4;font-size:34px;line-height:1;pointer-events:none;transform:translateX(-50%)}
.bub{border-radius:50%;background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.7),rgba(127,214,255,.35));border:2px solid #cfeeff;pointer-events:auto;cursor:pointer}
.bub.gold{background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.7),rgba(255,216,77,.7));border-color:#ffe48a}
#pads{position:fixed;left:50%;top:36%;transform:translate(-50%,-50%);display:none;grid-template-columns:repeat(2,min(32vw,120px));gap:12px;z-index:6}
body.gaming[data-game=simon] #pads{display:grid}
.pad{flex:none;aspect-ratio:1;border-radius:22px;border:0;padding:0;opacity:.55;transition:opacity .1s,transform .1s;box-shadow:inset 0 -6px 0 rgba(0,0,0,.25);cursor:pointer}
.pad.lit{opacity:1;transform:scale(1.08)}
#gm{position:fixed;inset:0;z-index:9;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.45)}
#gm.show{display:flex}
#gmc{background:rgba(25,15,50,.95);color:#fff1cf;border-radius:22px;padding:18px;width:min(86vw,320px);display:flex;flex-direction:column;gap:10px;text-align:center}
#gmc button{flex:none;width:100%;text-align:left}
#gmc small{display:block;font-weight:500;opacity:.85;font-size:12px}
.bub{display:flex;align-items:center;justify-content:center}
.bomb{font-size:30px;background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.5),rgba(255,80,80,.55));border-color:#ff8a8a}
#intro{position:fixed;inset:0;z-index:10;overflow:hidden;background:#6fb8f0}
#cam{position:absolute;left:0;right:0;top:0;height:200%}
.isky,.iporch{position:absolute;left:0;right:0;height:50%}
.isky{top:0;background:linear-gradient(#5aa9e8,#bfe4ff)}
.iporch{top:50%;background:linear-gradient(#bfe4ff 0 20%,#f1d6a8 20% 46%,#b9824b 46%)}
.iporch::after{content:"";position:absolute;left:0;right:0;top:46%;bottom:0;background:repeating-linear-gradient(90deg,rgba(0,0,0,.14) 0 2px,transparent 2px 44px)}
.rail{position:absolute;left:0;right:0;top:34%;height:14%;background:repeating-linear-gradient(90deg,#fff 0 10px,transparent 10px 36px);border-top:8px solid #fff}
.mat{position:absolute;left:50%;top:80%;width:46vw;max-width:220px;height:7%;transform:translateX(-50%);background:#c0392b;border-radius:8px;opacity:.9;z-index:1}
.cl{position:absolute;font-size:64px;opacity:.95;animation:flt 6s ease-in-out infinite}
.ring{position:absolute;left:50%;top:26%;width:min(34vw,140px);aspect-ratio:1;border-radius:50%;border:4px dashed rgba(255,255,255,.8);transform:translate(-50%,-50%);opacity:0;transition:opacity .6s}
.q{position:absolute;left:50%;top:26%;transform:translate(-50%,-50%);font-size:70px;color:#fff;opacity:0;display:block}
#intro.gone .ring{opacity:1}
#intro.gone .q{opacity:1;animation:shake .4s 3}
@keyframes shake{25%{transform:translate(-50%,-50%) rotate(-12deg)}75%{transform:translate(-50%,-50%) rotate(12deg)}}
#itxt{position:absolute;left:0;right:0;bottom:12%;text-align:center;font-size:clamp(20px,5.5vw,30px);font-weight:700;color:#fff;text-shadow:0 2px 8px rgba(0,60,120,.6);padding:0 16px}
#skip{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);right:12px;flex:none;width:auto;font-size:14px;padding:6px 14px;border-radius:999px;box-shadow:none;background:rgba(0,0,0,.3);color:#fff}
#sun{filter:var(--sk,none)}
body.night #sun{filter:var(--sk,none) brightness(.62) saturate(.85)}
body.rainbow #sun{animation:rbw 6s linear infinite}
@keyframes rbw{from{filter:hue-rotate(0deg)}to{filter:hue-rotate(360deg)}}
#wallet{position:absolute;top:10px;left:12px;z-index:4;flex:none;width:auto;font-size:15px;padding:6px 12px;border-radius:999px;background:var(--card);color:var(--ink);box-shadow:none;border:1px solid rgba(255,255,255,.25);backdrop-filter:blur(6px)}
body.gaming #wallet{opacity:.35;pointer-events:none}
#gmc{max-height:84vh;overflow:auto}
#gmc>*{flex-shrink:0}
@media (prefers-reduced-motion:reduce){#sunwrap,#glow,#stars i{animation:none}}
</style>
</head>
<body>
<div id="stars"></div>
<h1>My Sun!</h1>
<button id="gear" aria-label="Settings">⚙️</button>
<nav id="nav"><button data-r="space">🌌 Space</button><button data-r="kitchen">🍳 Kitchen</button><button data-r="bedroom">🛏️ Bedroom</button><button data-r="garden">🌳 Garden</button></nav>
<div id="decor"></div>
<div id="stage">
  <div id="fridge"><div class="fin" id="fin"></div><div class="fdoor" id="fdoor" role="button" aria-label="Open the fridge"></div></div>
  <div id="hint">Tap to poke him. Drag over him to pet.</div>
  <div id="jump"><div id="sunwrap">
    <svg id="sun" viewBox="0 0 360 360" aria-label="Your pet sun">
      <defs>
        <radialGradient id="gb" cx=".42" cy=".35" r=".75"><stop offset="0" stop-color="#ffec80"/><stop offset=".6" stop-color="#ffc93c"/><stop offset="1" stop-color="#f6a020"/></radialGradient>
        <radialGradient id="gf" gradientUnits="userSpaceOnUse" cx="180" cy="180" r="150"><stop offset=".78" stop-color="#e8541a"/><stop offset=".9" stop-color="#ff9a2e"/><stop offset="1" stop-color="#ffd75a"/></radialGradient>
        <radialGradient id="gg"><stop offset=".55" stop-color="#ffa628" stop-opacity=".6"/><stop offset="1" stop-color="#ff8a1f" stop-opacity="0"/></radialGradient>
        <clipPath id="cl"><circle cx="180" cy="180" r="118"/></clipPath>
      </defs>
      <circle id="glow" cx="180" cy="180" r="178" fill="url(#gg)"/>
      <path id="flames" fill="url(#gf)" stroke="#ff9a2e" stroke-width="2" stroke-linejoin="round"/>
      <circle cx="180" cy="180" r="120" fill="url(#gb)" stroke="#ff8b22" stroke-width="3"/>
      <g id="cells" clip-path="url(#cl)"></g>
      <g id="face" data-eyes="open">
        <ellipse id="bl1" cx="146" cy="199" rx="10" ry="5.5" fill="#ff5a2e" opacity="0"/>
        <ellipse id="bl2" cx="220" cy="199" rx="10" ry="5.5" fill="#ff5a2e" opacity="0"/>
        <g transform="translate(163 180)"><g class="eye"><ellipse rx="8.5" ry="11.5" fill="#fff" stroke="#7a3a10" stroke-width="1.5"/></g>
          <path class="arc" d="M-9 5 Q0 -9 9 5" fill="none" stroke="#6a2a08" stroke-width="4" stroke-linecap="round"/>
          <path class="closed" d="M-9 0 Q0 7 9 0" fill="none" stroke="#6a2a08" stroke-width="4" stroke-linecap="round"/></g>
        <g transform="translate(200 180)"><g class="eye"><ellipse rx="8.5" ry="11.5" fill="#fff" stroke="#7a3a10" stroke-width="1.5"/></g>
          <path class="arc" d="M-9 5 Q0 -9 9 5" fill="none" stroke="#6a2a08" stroke-width="4" stroke-linecap="round"/>
          <path class="closed" d="M-9 0 Q0 7 9 0" fill="none" stroke="#6a2a08" stroke-width="4" stroke-linecap="round"/></g>
        <path id="mouth" stroke="#7a2a0a" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </g>
    </svg>
  </div></div>
  <div id="cap"></div>
</div>
<div id="fx"></div>
<div id="panel"><b>Settings</b>
<label>Music <input type="checkbox" id="o-m"></label>
<label>Music volume <input type="range" id="v-m" min="0" max="100"></label>
<label>Sound FX <input type="checkbox" id="o-s"></label>
<label>FX volume <input type="range" id="v-s" min="0" max="100"></label>
<div>Sun color</div><div class="sw" id="sw"></div>
<button id="reset">Reset my sun</button></div>
<div id="ui">
  <div class="stats">
    <div class="stat">🍩 Full<div class="bar"><i id="b-h" style="background:#ff9a4d"></i></div></div>
    <div class="stat">💛 Joy<div class="bar"><i id="b-j" style="background:#ffd84d"></i></div></div>
    <div class="stat">⚡ Energy<div class="bar"><i id="b-e" style="background:#7fd6ff"></i></div></div>
  </div>
  <div class="btns">
    <button id="feed">Feed</button><button id="play">Play</button><button id="games">Games</button><button id="sleep">Sleep</button>
  </div>
</div>
<script>
const $=id=>document.getElementById(id);
const svg=$('sun'),jump=$('jump'),FX=$('fx'),mouth=$('mouth');
const eyes=[...document.querySelectorAll('.eye')],pups=[...document.querySelectorAll('.pup')];
let sd=7;const rnd=()=>(sd=(sd*16807)%2147483647)/2147483647;

/* stars */
for(let i=0;i<70;i++){const s=document.createElement('i'),z=1+rnd()*2;s.style.cssText=`left:${rnd()*100}%;top:${rnd()*100}%;width:${z}px;height:${z}px;animation-delay:${-rnd()*4}s`;$('stars').appendChild(s)}

/* sun surface cells */
const mid=(a,b)=>((a[0]+b[0])/2).toFixed(1)+' '+((a[1]+b[1])/2).toFixed(1);
let cells='';
for(let k=0;k<24;k++){
  const a=rnd()*6.28,d=Math.sqrt(rnd())*105,cx=180+Math.cos(a)*d,cy=180+Math.sin(a)*d,n=8,rr=10+rnd()*17,pts=[];
  for(let i=0;i<n;i++){const b=i/n*6.28,r=rr*(.7+rnd()*.6);pts.push([cx+Math.cos(b)*r,cy+Math.sin(b)*r*.8])}
  let p='M'+mid(pts[n-1],pts[0]);
  for(let i=0;i<n;i++)p+='Q'+pts[i][0].toFixed(1)+' '+pts[i][1].toFixed(1)+' '+mid(pts[i],pts[(i+1)%n]);
  cells+=`<path d="${p}Z" fill="rgba(255,243,160,.32)" stroke="rgba(255,150,40,.55)" stroke-width="2.5"/>`;
}
$('cells').innerHTML=cells;

/* flickering flames */
const N=100,fl=$('flames'),ph=[...Array(N)].map(()=>[rnd()*6.28,1+rnd()*2,.45+rnd()*.55]);
function flames(t){let d='';for(let i=0;i<N;i++){const a=i/N*6.2832,p=ph[i],r=i%2===0?122+(8+16*p[2])*(.6+.4*Math.sin(t/420*p[1]+p[0])):115;d+=(i?'L':'M')+(180+Math.cos(a)*r).toFixed(1)+' '+(180+Math.sin(a)*r).toFixed(1)}fl.setAttribute('d',d+'Z')}
(function loop(t){flames(t);requestAnimationFrame(loop)})(0);

/* state */
let S={h:80,j:70,e:90},sleeping=false,tempUntil=0,mt=0,chew=0;
try{const v=JSON.parse(localStorage.getItem('mysun')||'null');if(v){const dt=Math.min((Date.now()-v.ts)/1000,3600);S={h:Math.max(15,v.h-dt*.05),j:Math.max(15,v.j-dt*.04),e:Math.max(15,v.e-dt*.03)}}}catch(e){}
const clamp=v=>Math.max(0,Math.min(100,v));

/* moods */
const M={
 neutral:{eyes:'open',d:'M172 208 Q183 217 194 208',fill:0,ch:0},
 content:{eyes:'open',d:'M170 206 Q183 222 196 206',fill:0,ch:.35},
 love:{eyes:'arc',d:'M168 203 Q183 226 198 203Z',fill:1,ch:.75},
 oh:{eyes:'open',d:'M178 207 a5 6.5 0 1 0 10 0 a5 6.5 0 1 0 -10 0',fill:1,ch:0},
 sad:{eyes:'open',d:'M172 215 Q183 205 194 215',fill:0,ch:0},
 sleep:{eyes:'closed',d:'M177 210 Q183 214 189 210',fill:0,ch:.15},
 chewA:{eyes:'arc',d:'M170 205 Q183 225 196 205Z',fill:1,ch:.5},
 chewB:{eyes:'arc',d:'M174 209 Q183 213 192 209Z',fill:1,ch:.5}};
function apply(m){const o=M[m];$('face').dataset.eyes=o.eyes;mouth.setAttribute('d',o.d);mouth.setAttribute('fill',o.fill?'#8a2a0c':'none');$('bl1').setAttribute('opacity',o.ch);$('bl2').setAttribute('opacity',o.ch)}
function base(){if(sleeping)return'sleep';if(Math.min(S.h,S.j,S.e)<25)return'sad';return S.j>75?'content':'neutral'}
function mood(m,ms){apply(m);tempUntil=Date.now()+ms;clearTimeout(mt);mt=setTimeout(()=>apply(base()),ms)}
function caption(){if(sleeping)return'Zzz…';if(S.h<25)return'His tummy is rumbling';if(S.e<25)return'He is getting sleepy';if(S.j<25)return'He feels lonely';if(S.j>75)return'Super happy!';return'Just shining along'}

/* helpers */
function C(){const r=svg.getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2,r:r.width/3}}

 const ck=e=>{if(!e.target.closest('#hud'))jmp()},kd=e=>{if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();jmp()}};
